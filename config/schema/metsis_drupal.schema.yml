metsis_drupal.settings:
  type: config_object
  label: 'Metsis Search settings'
  constraints:
    FullyValidatable: ~
  mapping:
    selected_collections:
      type: sequence
      label: 'Selected collections'
      description: 'A mapping of collection keys to their labels.'
      constraints:
          NotBlank: ~
      sequence:
        type: label
        label: 'Collection'
        constraints:
          NotBlank: ~
          Regex:
            pattern: /^[A-Z]+$/
            message: 'Collection keys must be uppercase letters only.'
    map_default_projection:
      type: string
      label: 'Default map projection'
      description: 'The default OpenLayers projection used when the map app loads.'
      constraints:
        Choice:
          choices: ['EPSG:4326', 'EPSG:3857', 'EPSG:32661', 'EPSG:32761']
    map_default_zoom:
      type: integer
      label: 'Default map zoom level'
      constraints:
        Range:
          min: 0
          max: 28
    map_default_center_lat:
      type: float
      label: 'Default map center latitude'
      constraints:
        Range:
          min: -90.0
          max: 90.0
    map_default_center_lon:
      type: float
      label: 'Default map center longitude'
      constraints:
        Range:
          min: -180.0
          max: 180.0
    bokeh_plot_service_url:
      type: uri
      label: 'Plot service url endpoint'
      description: 'The URL endpoint for the Bokeh plot service.'
      constraints:
        NotBlank: ~
    feature_type_lookup_service:
      type: uri
      label: 'featureType lookup service url endpoint'
      description: 'The URL endpoint for the featureType lookup service.'
      constraints:
        NotBlank: ~
    enabled_export_types:
      type: sequence
      label: 'Enabled metadata export types'
      description: 'Export types available in the metadata export form.'
      sequence:
        type: string
        label: 'Export type'
      constraints:
        NotBlank: ~
    search_meta_description:
      type: string
      label: 'Search page meta description'
      description: 'Meta description used for the METSIS search results page.'
      constraints:
        NotBlank: ~

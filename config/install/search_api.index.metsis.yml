processor_settings:
  add_url: {  }
  aggregated_field: {  }
  auto_aggregated_fulltext_field: {  }
  custom_value: {  }
  entity_type: {  }
  geojson_transformer:
    weights:
      postprocess_query: 0
  highlight:
    weights:
      postprocess_query: 0
    prefix: '<span class="metsis-hl">'
    suffix: '</span class="metsis-hl">'
    excerpt: true
    excerpt_always: false
    excerpt_length: 320
    exclude_fields: {  }
    highlight: server
    highlight_partial: true
  language_with_fallback: {  }
  rendered_item: {  }
  solr_date_range:
    weights:
      preprocess_index: 0
  solr_geojson_field_transformer:
    weights:
      postprocess_query: 0
      preprocess_query: 0
tracker_settings:
  default:
    indexing_order: fifo
options:

# License icons configuration for Metsis Drupal module. Icon path without extension.(added dynamically in twig template)
# Replca 1.0 to 1_0, since drupal config object do not allow . in keys
license_icons:
  'CC0-1_0':
    license_uri: "https://spdx.org/licenses/CC0-1.0"
    icon_path: "assets/license_icons/CC0"
    icon_alt_text: "Creative Commons Zero v1.0 Universal"

  CC-BY-3_0:
    license_uri: "https://spdx.org/licenses/CC-BY-3.0"
    icon_path: "assets/license_icons/CCBY"
    icon_alt_text: "Creative Commons Attribution 3.0 Unported"

  CC-BY-4_0:
    license_uri: "https://spdx.org/licenses/CC-BY-4.0"
    icon_path: "assets/license_icons/CCBY"
    icon_alt_text: "Creative Commons Attribution 4.0 International"

  CC-BY/NLOD:
    license_uri: "https://spdx.org/licenses/CC-BY-4.0"
    icon_path: "assets/license_icons/CCBY"
    icon_alt_text: "Creative Commons Attribution 4.0 International"

  CC BY/NLOD:
    license_uri: "https://spdx.org/licenses/CC-BY-4.0"
    icon_path: "assets/license_icons/CCBY"
    icon_alt_text: "Creative Commons Attribution 4.0 International"

  CC-BY-SA-4_0:
    license_uri: "https://spdx.org/licenses/CC-BY-SA-4.0"

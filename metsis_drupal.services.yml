services:
  _defaults:
    autowire: true
    autoconfigure: true

  logger.channel.metsis_drupal:
    parent: logger.channel_base
    arguments: ["metsis"]

  metsis_drupal.search_api_subscriber:
    class: Drupal\metsis_drupal\EventSubscriber\SearchApiSubscriber
    arguments: []
    tags:
      - { name: event_subscriber }

  metsis_drupal.search_api_solr_subscriber:
    class: Drupal\metsis_drupal\EventSubscriber\SearchApiSolrSubscriber
    arguments:
      - "@config.factory"
      - "@metsis_drupal.metsis_helper"
    tags:
      - { name: event_subscriber }

  metsis_drupal.metsis_search_ajax_subscriber:
    class: Drupal\metsis_drupal\EventSubscriber\ViewsAjaxResponseSubscriber
    arguments: []
    tags:
      - { name: event_subscriber }

  metsis_drupal.bokeh_plot_service:
    class: Drupal\metsis_drupal\Service\BokehPlotService
    arguments:
      - "@http_client"
      - "@config.factory"

  metsis_drupal.feature_type_lookup_service:
    class: Drupal\metsis_drupal\Service\FeatureTypeLookupService
    arguments:
      - "@http_client"
      - "@config.factory"

  metsis_drupal.metsis_helper:
    class: Drupal\metsis_drupal\Utility\MetsisHelper
    arguments:
      - "@entity_type.manager"
      - "@leaflet.service"
      - "@renderer"
      - "@module_handler"
      - "@config.factory"
      - "@metsis_drupal.feature_type_lookup_service"
      - "@metsis_drupal.met_vocab_service"

  metsis_drupal.status_report_service:
    class: Drupal\metsis_drupal\Service\StatusReportService
    arguments:
      - "@entity_type.manager"
      - "@module_handler"
      - "@config.factory"

  # Alias the FQCN to the service id so type-hinted injections (autowire)
  # resolve to the defined service instead of attempting a no-arg instantiation.
  Drupal\metsis_drupal\Utility\MetsisHelper:
    alias: "metsis_drupal.metsis_helper"

  metsis_drupal.result_row_renderer:
    class: Drupal\metsis_drupal\Service\ResultRowRenderer
    arguments:
      ["@metsis_drupal.metsis_helper", "@module_handler", "@config.factory", "@metsis_drupal.met_vocab_service"]

  metsis_drupal.metadata_export_service:
    class: Drupal\metsis_drupal\Service\MetadataExportService
    arguments:
      - "@config.factory"
      - "@entity_type.manager"

  Drupal\metsis_drupal\Service\MetadataExportService:
    alias: "metsis_drupal.metadata_export_service"

  # --- Met vocabulary service -------------------------------------------------

  # Dedicated cache bin for the parsed MMD vocabulary index (24 h TTL).
  cache.metsis_vocab:
    class: Drupal\Core\Cache\CacheBackendInterface
    factory: ['@cache_factory', 'get']
    arguments: ['metsis_vocab']
    tags: []

  metsis_drupal.met_vocab_service:
    class: Drupal\metsis_drupal\Service\MetVocabService
    arguments:
      - "@config.factory"
      - "@cache.metsis_vocab"
      - "@datetime.time"

  # Alias the interface so type-hinted injections resolve to this service.
  Drupal\metsis_drupal\Service\MetVocabServiceInterface:
    alias: "metsis_drupal.met_vocab_service"

  # Cron hook class — explicit registration needed for constructor DI.
  metsis_drupal.cron_hook:
    class: Drupal\metsis_drupal\Hook\CronHook
    arguments:
      - "@metsis_drupal.met_vocab_service"

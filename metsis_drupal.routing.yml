metsis_drupal.admin_metno:
  path: "/admin/config/metno"
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: "METNO"
  requirements:
    _permission: "administer site configuration"

metsis_drupal.settings:
  path: "/admin/config/metno/metsis-drupal"
  defaults:
    _form: '\Drupal\metsis_drupal\Form\MetsisSettingsForm'
    _title: "Configure METSIS settings"
  requirements:
    _permission: "administer site configuration"

metsis_drupal.status_report:
  path: "/admin/reports/metsis-status-report"
  defaults:
    _title: "METSIS Status Report"
    _controller: '\Drupal\metsis_drupal\Controller\MetsisStatusReportController::statusReportPage'
  requirements:
    _permission: "administer metsis"

metsis_drupal.bokeh_plot:
  path: "/services/bokeh-plot/get"
  defaults:
    _controller: '\Drupal\metsis_drupal\Controller\BokehPlotController::getPlot'
    _title: "Bokeh Plot"
  requirements:
    _permission: "access content"
  options:
    _htmx_route: true

metsis_drupal.bokeh_plot_form:
  path: "/services/bokeh-plot/form"
  defaults:
    _form: '\Drupal\metsis_drupal\Form\BokehPlotForm'
    _title: "Bokeh Plot Form"
  requirements:
    _permission: "access content"

metsis_drupal.metadata_export_form:
  path: "/metsis/metadata/export/{id}"
  defaults:
    _form: '\Drupal\metsis_drupal\Form\MetadataExportForm'
    _title: "Metadata export"
  requirements:
    _permission: "access metsis metadata export"
    id: "[A-Za-z0-9_.:-]+"

metsis_drupal.metadata_export_download:
  path: "/metsis/metadata/export/download/{id}/{type}"
  defaults:
    _controller: '\Drupal\metsis_drupal\Controller\MetadataExportController::download'
    _title: "Metadata export download"
  requirements:
    _permission: "access metsis metadata export"
    id: "[A-Za-z0-9_.:-]+"
    type: "[a-z0-9_-]+"

metsis_drupal.metadata_export_htmx_redirect:
  path: "/metsis/metadata/export/htmx/{id}/{type}"
  defaults:
    _controller: '\Drupal\metsis_drupal\Controller\MetadataExportController::htmxRedirect'
    _title: "HTMX Metadata export download redirect"
  requirements:
    _permission: "access metsis metadata export"
    id: "[A-Za-z0-9_.:-]+"
    type: "[a-z0-9_-]+"
  options:
    _htmx_route: true

"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: search
status: stable
group: metsis
description: Search input with magnifier button and X reset button
props:
  type: object
  properties:
    placeholder:
      type: string
      title: Placeholder
      description: Placeholder for the search input
      default: Type your text
      examples:
        - Search datasets by title or keyword
        - Search Arctic temperature observations
slots:
  other_components:
    title: Other components
    description: Additional controls displayed after the search input.
    examples:
      - '<button type="reset">Clear search</button>'

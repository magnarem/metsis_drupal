"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: cc_license
status: stable
group: metsis
description: Renders a Creative Commons license icon with a link to the license description.
props:
  type: object
  properties:
    license_id:
      type: string
      title: License identifier
      description: The license identifier, e.g., CC-BY-4.0.
      examples:
        - CC-BY-4.0
        - CC0-1.0
    license_url:
      type: string
      title: License URL
      description: The URL to the Creative Commons license page.
      examples:
        - "https://creativecommons.org/licenses/by/4.0/"
        - "https://creativecommons.org/publicdomain/zero/1.0/"
    icon_id:
      type: string
      title: Icon ID
      description: The ID of the SVG icon to display for the license.
      examples:
        - by
        - cc-zero
    icon_alt_text:
      type: string
      title: Icon alt text
      description: The alt text for the icon (The long descriptive name of the license).
      examples:
        - Creative Commons Attribution 4.0 International
        - Creative Commons Zero v1.0 Universal
    width:
      type: integer
      title: Width
      description: Width of the license icon. Height is auto-scaled to preserve aspect ratio.
      default: 88
      examples:
        - 120

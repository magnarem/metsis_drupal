"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: bbox-form-tabs
status: stable
group: metsis
description: Display the Bbox map input and coordinates input in a tabs component
libraryOverrides:
  dependencies:
    - core/once
    - core/drupal
props:
  type: object
  properties:
    default_tab:
      type: string
      title: Default tab
      description: The default tab to show
      default: "map"
      enum: ["map", "coords"]
      examples:
        - "map"
        - "coords"
slots:
  map_input_tab:
    title: Map input tab
    description: The tab for the map form input
    examples:
      - '<div aria-label="Bounding box map">Select an area on the map.</div>'
  coords_input_tab:
    title: Coordinates input tab
    description: The coordinates form input
    examples:
      - '<label>North latitude <input type="number" value="70" min="-90" max="90"></label>'

services:
  nbs_extensions.netcdf_response_subscriber:
    class: Drupal\nbs_extensions\EventSubscriber\NetCDFResponseSubscriber
    tags:
      - { name: event_subscriber }

  logger.channel.nbs_extensions:
    parent: logger.channel_base
    arguments: ["nbs_extensions"]

  nbs_extensions.netcdf_on_demand:
    class: Drupal\nbs_extensions\Service\NetCDFOnDemandService
    arguments:
      - "@http_client"
      - "@config.factory"
      - "@logger.channel.nbs_extensions"

  nbs_extensions.netcdf_on_demand_button_builder:
    class: Drupal\nbs_extensions\Service\NetCDFOnDemandButtonBuilder
    arguments:
      - "@config.factory"

name: Quality

on:
  push:
  pull_request:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        run: npx eslint .

  prettier-check:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Prettier check
        run: npx prettier --check .

  php-setup:
    name: PHP Tools Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install Drupal dev tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phptools
          cd /tmp/phptools
          composer create-project drupal/recommended-project:^11 check-metsis --no-interaction --no-progress
          cd check-metsis
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.wikimedia/composer-merge-plugin true
          composer config --no-plugins allow-plugins.phpdocumentor/shim true
          composer require wikimedia/composer-merge-plugin:^2.0 --no-interaction --no-progress
          composer config --json extra.merge-plugin.include "[\"${GITHUB_WORKSPACE}/composer.json\"]"
          composer require --dev -W drupal/core-dev:^11 --no-interaction --no-progress

      - name: Archive PHP tools
        run: tar -czf /tmp/phptools.tar.gz -C /tmp phptools/

      - name: Upload PHP tools artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-tools
          path: /tmp/phptools.tar.gz
          retention-days: 1

  phpstan:
    name: PHPStan
    needs: php-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Download and extract PHP tools
        uses: actions/download-artifact@v8
        with:
          name: php-tools
          path: /tmp

      - name: Symlink vendor and web
        run: |
          tar -xzf /tmp/phptools.tar.gz -C /tmp
          ln -sfn /tmp/phptools/check-metsis/vendor "$GITHUB_WORKSPACE/vendor"
          ln -sfn /tmp/phptools/check-metsis/web "$GITHUB_WORKSPACE/web"

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon

  phpcs:
    name: PHPCS
    needs: php-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Download and extract PHP tools
        uses: actions/download-artifact@v8
        with:
          name: php-tools
          path: /tmp

      - name: Prepare Drupal paths for PHPCS
        run: |
          set -euo pipefail
          tar -xzf /tmp/phptools.tar.gz -C /tmp
          ln -sfn /tmp/phptools/check-metsis/vendor "$GITHUB_WORKSPACE/vendor"
          ln -sfn /tmp/phptools/check-metsis/web "$GITHUB_WORKSPACE/web"
          mkdir -p "$GITHUB_WORKSPACE/web/modules/custom"
          mkdir -p "$GITHUB_WORKSPACE/web/themes/custom"
          mkdir -p "$GITHUB_WORKSPACE/web/profiles/custom"
          mkdir -p "$GITHUB_WORKSPACE/web/sites/default"
          touch "$GITHUB_WORKSPACE/web/sites/default/settings.php"
          touch "$GITHUB_WORKSPACE/web/sites/default/settings.local.php"
          ln -sfn "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/web/modules/custom/metsis_drupal"

      - name: Run PHPCS
        run: |
          test -e phpcs.xml.dist || curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/assets/phpcs.xml.dist
          vendor/bin/phpcs -s --report-full --report-summary

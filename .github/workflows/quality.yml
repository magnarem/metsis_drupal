name: Quality and Tests

on:
  push:
  pull_request:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        run: npx eslint .

  prettier-check:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Prettier check
        run: npx prettier --check .

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare Drupal project
        uses: ./.github/actions/drupal-prepare
        with:
          site-name: metsis_drupal
          project-paths: modules/custom
          ensure-themes-custom: "true"
          ensure-profiles-custom: "true"

      - name: Run PHPStan
        run: |
          cd $GITHUB_WORKSPACE
          vendor/bin/phpstan analyse --configuration=phpstan.neon

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare Drupal project
        uses: ./.github/actions/drupal-prepare
        with:
          site-name: metsis_drupal
          project-paths: modules/custom
          ensure-themes-custom: "true"
          ensure-profiles-custom: "true"

      - name: Run PHPCS
        run: |
          cd $GITHUB_WORKSPACE
          vendor/bin/phpcs -s --report-full --report-summary

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare Drupal project
        uses: ./.github/actions/drupal-prepare
        with:
          site-name: metsis_drupal
          project-paths: modules/custom
          ensure-themes-custom: "true"
          ensure-profiles-custom: "false"
          provision-mmd: "true"

      - name: Prepare PHPUnit config
        run: |
          sed "s|/var/www/html|$GITHUB_WORKSPACE|g" "$GITHUB_WORKSPACE/phpunit.xml" > "$GITHUB_WORKSPACE/phpunit.ci.xml"
          cd $GITHUB_WORKSPACE

      - name: Run PHPUnit
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE
          export SIMPLETEST_DB="sqlite://localhost/$GITHUB_WORKSPACE/web/sites/default/files/simpletest.sqlite"
          vendor/bin/phpunit --configuration="$GITHUB_WORKSPACE/phpunit.ci.xml" tests/

name: Quality and Tests

on:
  push:
  pull_request:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        run: npx eslint .

  prettier-check:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Prettier check
        run: npx prettier --check .

  php-setup:
    name: PHP Tools Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install Drupal dev tools
        shell: bash
        run: |
          set -eu -o pipefail
          export COMPOSER=composer.contrib.json
          export DRUPAL_CORE=${DRUPAL_CORE:-^11}
          export DDEV_SITENAME=metsis_drupal
          curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/expand_composer_json.php
          _ddev_drupal_contrib_empty_composer=false
          if [[ ! -f composer.json ]]; then
            echo "{}" > composer.json
            _ddev_drupal_contrib_empty_composer=true
          fi
          php expand_composer_json.php "$DDEV_SITENAME"
          rm -f expand_composer_json.php
          if [ "$_ddev_drupal_contrib_empty_composer" = true ];  then
            rm -f composer.json
          fi
          composer install "$@"
          # The -f flag suppresses errors if lock file does not exist.
          rm -f composer.contrib.json composer.contrib.lock
          curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/symlink_project.php
          export DDEV_DOCROOT="$GITHUB_WORKSPACE/web"
          export DRUPAL_PROJECTS_PATH="modules/custom"
          if [ ! -d "$DDEV_DOCROOT/themes/custom" ]; then
            mkdir -p "$DDEV_DOCROOT/themes/custom"
          fi
          if [ -n "${PROJECT_FILES-}" ]; then
            # Suppress a warning.
            PROJECT_FILES=$(ls -A --ignore="web" --ignore="vendor" --ignore="symlink_project.php" --ignore=".ddev" --ignore=".idea")
            export PROJECT_FILES
          fi

          # Symlink name using underscores.
          # @see https://www.drupal.org/docs/develop/creating-modules/naming-and-placing-your-drupal-module
          # DRUPAL_PROJECT_FOLDER is used by the symlink-project script in gitlab_templates
          export DRUPAL_PROJECT_FOLDER=${DDEV_DOCROOT}/${DRUPAL_PROJECTS_PATH}/${DDEV_SITENAME//-/_}
          php symlink_project.php
          rm -f symlink_project.php


      - name: Archive PHP tools
        run: tar -czf /tmp/phptools.tar.gz -C /tmp $GITHUB_WORKSPACE

      - name: Upload PHP tools artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-tools
          path: /tmp/phptools.tar.gz
          retention-days: 1

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare project for PHPStan
        run: |
          set -eu -o pipefail
          export COMPOSER=composer.contrib.json
          export DRUPAL_CORE=${DRUPAL_CORE:-^11}
          export DDEV_SITENAME=metsis_drupal
          curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/expand_composer_json.php
          _ddev_drupal_contrib_empty_composer=false
          if [[ ! -f composer.json ]]; then
            echo "{}" > composer.json
            _ddev_drupal_contrib_empty_composer=true
          fi
          php expand_composer_json.php "$DDEV_SITENAME"
          rm -f expand_composer_json.php
          if [ "$_ddev_drupal_contrib_empty_composer" = true ];  then
            rm -f composer.json
          fi
          composer install "$@"
          # The -f flag suppresses errors if lock file does not exist.
          rm -f composer.contrib.json composer.contrib.lock
          curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/symlink_project.php
          export DDEV_DOCROOT="$GITHUB_WORKSPACE/web"
          export DRUPAL_PROJECTS_PATH="modules/custom"
          if [ ! -d "$DDEV_DOCROOT/themes/custom" ]; then
            mkdir -p "$DDEV_DOCROOT/themes/custom"
          fi
          if [ ! -d "$DDEV_DOCROOT/profiles/custom" ]; then
            mkdir -p "$DDEV_DOCROOT/profiles/custom"
          fi
          if [ -n "${PROJECT_FILES-}" ]; then
            # Suppress a warning.
            PROJECT_FILES=$(ls -A --ignore="web" --ignore="vendor" --ignore="symlink_project.php" --ignore=".ddev" --ignore=".idea")
            export PROJECT_FILES
          fi

          # Symlink name using underscores.
          # @see https://www.drupal.org/docs/develop/creating-modules/naming-and-placing-your-drupal-module
          # DRUPAL_PROJECT_FOLDER is used by the symlink-project script in gitlab_templates
          export DRUPAL_PROJECT_FOLDER=${DDEV_DOCROOT}/${DRUPAL_PROJECTS_PATH}/${DDEV_SITENAME//-/_}
          php symlink_project.php
          rm -f symlink_project.php

      - name: Run PHPStan
        run: |
          cd $GITHUB_WORKSPACE
          vendor/bin/phpstan analyse --configuration=phpstan.neon

  phpcs:
    name: PHPCS
    needs: php-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare Drupal paths for PHPCS
        run: |
          set -eu -o pipefail
          export COMPOSER=composer.contrib.json
          export DRUPAL_CORE=${DRUPAL_CORE:-^11}
          export DDEV_SITENAME=metsis_drupal
          curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/expand_composer_json.php
          _ddev_drupal_contrib_empty_composer=false
          if [[ ! -f composer.json ]]; then
            echo "{}" > composer.json
            _ddev_drupal_contrib_empty_composer=true
          fi
          php expand_composer_json.php "$DDEV_SITENAME"
          rm -f expand_composer_json.php
          if [ "$_ddev_drupal_contrib_empty_composer" = true ];  then
            rm -f composer.json
          fi
          composer install "$@"
          # The -f flag suppresses errors if lock file does not exist.
          rm -f composer.contrib.json composer.contrib.lock
          curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/symlink_project.php
          export DDEV_DOCROOT="$GITHUB_WORKSPACE/web"
          export DRUPAL_PROJECTS_PATH="modules/custom"
          if [ ! -d "$DDEV_DOCROOT/themes/custom" ]; then
            mkdir -p "$DDEV_DOCROOT/themes/custom"
          fi
          if [ ! -d "$DDEV_DOCROOT/profiles/custom" ]; then
            mkdir -p "$DDEV_DOCROOT/profiles/custom"
          fi
          if [ -n "${PROJECT_FILES-}" ]; then
            # Suppress a warning.
            PROJECT_FILES=$(ls -A --ignore="web" --ignore="vendor" --ignore="symlink_project.php" --ignore=".ddev" --ignore=".idea")
            export PROJECT_FILES
          fi

          # Symlink name using underscores.
          # @see https://www.drupal.org/docs/develop/creating-modules/naming-and-placing-your-drupal-module
          # DRUPAL_PROJECT_FOLDER is used by the symlink-project script in gitlab_templates
          export DRUPAL_PROJECT_FOLDER=${DDEV_DOCROOT}/${DRUPAL_PROJECTS_PATH}/${DDEV_SITENAME//-/_}
          php symlink_project.php
          rm -f symlink_project.php


      - name: Run PHPCS
        run: |
          test -e phpcs.xml.dist || curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/assets/phpcs.xml.dist
          vendor/bin/phpcs -s --report-full --report-summary

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Download and extract PHP tools
        uses: actions/download-artifact@v8
        with:
          name: php-tools
          path: /tmp

      - name: Prepare Drupal paths and PHPUnit config
        run: |
          set -eu -o pipefail
          export COMPOSER=composer.contrib.json
          export DRUPAL_CORE=${DRUPAL_CORE:-^11}
          export DDEV_SITENAME=metsis_drupal
          curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/expand_composer_json.php
          _ddev_drupal_contrib_empty_composer=false
          if [[ ! -f composer.json ]]; then
            echo "{}" > composer.json
            _ddev_drupal_contrib_empty_composer=true
          fi
          php expand_composer_json.php "$DDEV_SITENAME"
          rm -f expand_composer_json.php
          if [ "$_ddev_drupal_contrib_empty_composer" = true ];  then
            rm -f composer.json
          fi
          composer install "$@"
          # The -f flag suppresses errors if lock file does not exist.
          rm -f composer.contrib.json composer.contrib.lock
          curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/symlink_project.php
          export DDEV_DOCROOT="$GITHUB_WORKSPACE/web"
          export DRUPAL_PROJECTS_PATH="modules/custom"
          if [ ! -d "$DDEV_DOCROOT/themes/custom" ]; then
            mkdir -p "$DDEV_DOCROOT/themes/custom"
          fi
          if [ -n "${PROJECT_FILES-}" ]; then
            # Suppress a warning.
            PROJECT_FILES=$(ls -A --ignore="web" --ignore="vendor" --ignore="symlink_project.php" --ignore=".ddev" --ignore=".idea")
            export PROJECT_FILES
          fi

          # Symlink name using underscores.
          # @see https://www.drupal.org/docs/develop/creating-modules/naming-and-placing-your-drupal-module
          # DRUPAL_PROJECT_FOLDER is used by the symlink-project script in gitlab_templates
          export DRUPAL_PROJECT_FOLDER=${DDEV_DOCROOT}/${DRUPAL_PROJECTS_PATH}/${DDEV_SITENAME//-/_}
          php symlink_project.php
          rm -f symlink_project.php

          sed "s|/var/www/html|$GITHUB_WORKSPACE|g" "$GITHUB_WORKSPACE/phpunit.xml" > "$GITHUB_WORKSPACE/phpunit.ci.xml"

      - name: Run PHPUnit
        run: |
          set -euo pipefail
          export SIMPLETEST_DB="sqlite://localhost/$GITHUB_WORKSPACE/web/sites/default/files/simpletest.sqlite"
          vendor/bin/phpunit --configuration="$GITHUB_WORKSPACE/phpunit.ci.xml" tests/

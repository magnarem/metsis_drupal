name: Quality

on:
  push:
  pull_request:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        run: npx eslint .

  prettier-check:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Prettier check
        run: npx prettier --check .

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Create minimal composer.json for dev tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phptools
          cd /tmp/phptools
          composer create-project drupal/recommended-project check-metsis
          cd check-metsis
          test -e phpcs.xml.dist || curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/assets/phpcs.xml.dist
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installe true
          composer require drupal/core-dev:^11
          ln -sfn /tmp/phptools/check-metsis/vendor "$GITHUB_WORKSPACE/vendor"
          ln -sfn /tmp/phptools/check-metsis/web "$GITHUB_WORKSPACE/web"

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Create minimal composer.json for dev tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phptools
          cd /tmp/phptools
          composer create-project drupal/recommended-project check-metsis
          cd check-metsis
          composer update
          composer install -o
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installe true
          composer require drupal/core-dev:^11
          ln -sfn /tmp/phptools/check-metsis/vendor "$GITHUB_WORKSPACE/vendor"
          ln -sfn /tmp/phptools/check-metsis/web "$GITHUB_WORKSPACE/web"


      - name: Run PHPCS
        run: |
          test -e phpcs.xml.dist || curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/assets/phpcs.xml.dist
          vendor/bin/phpcs -s -report-full --report-summary
